---
launch:

  - arg:
      name: arm_activate
      default: 'True'
      description: Whether to activate the manipulator controllers
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: use_servo
      default: 'False'
      description: >-
        Whether to run moveit_servo and its joy2servo gamepad front end. Off by
        default because nothing in the autonomous stack drives it. Measured on
        the badminton court with no trial running, servo_node sat at 64 percent
        of a core while /servo_node/delta_twist_cmds had zero publishers, and
        the only publisher on delta_joint_cmds was joy2servo itself. That is a
        teleop path, so it costs most of a core to serve a gamepad nobody is
        holding. On an 8 core machine already at load 26 with a real time factor
        of 0.54, that is the difference between nav2 meeting its control
        deadlines and timing out. Set True for gamepad teleop.
      choice:
        - value: 'True'
        - value: 'False'

  - arg:
      name: use_sim
      default: 'False'
      description: >-
        Whether this is a simulated robot. The wrist roll joint (joint5) only
        exists in the simulated URDF, so its controller is spawned only here.

  - arg:
      name: controller_manager_timeout
      default: '60'
      description: >-
        Seconds the spawner waits for controller_manager to load + activate the
        controllers. Raised from 20 for slower SBCs (see controller.yaml).

  - node:
      pkg: controller_manager
      exec: spawner
      args: >
        manipulator_controller
        gripper_controller
        -c controller_manager
        --controller-manager-timeout $(var controller_manager_timeout)
      if: $(var arm_activate)

  - node:
      pkg: controller_manager
      exec: spawner
      args: >
        manipulator_controller
        gripper_controller
        -c controller_manager
        --controller-manager-timeout $(var controller_manager_timeout)
        --inactive
      unless: $(var arm_activate)

  - node:
      pkg: controller_manager
      exec: spawner
      args: >
        wrist_roll_controller
        -c controller_manager
        --controller-manager-timeout $(var controller_manager_timeout)
      if: $(var use_sim)

  - include:
      file: $(find-pkg-share rosbot_moveit)/launch/move_group.launch.py
      arg:
        # Selects the gripper's Close named state. The simulation-only claw
        # closes to -0.023; hardware stops at -0.010 and would reject it.
        - name: use_sim
          value: $(var use_sim)

  - include:
      file: $(find-pkg-share rosbot_moveit)/launch/servo.launch.py
      if: $(var use_servo)

  - include:
      file: $(find-pkg-share rosbot_moveit)/launch/home.launch.py
      if: $(var arm_activate)
